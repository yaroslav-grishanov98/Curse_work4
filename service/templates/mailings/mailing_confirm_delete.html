{% extends "base.html" %}

{% block content %}
<h1>Удаление рассылки</h1>
<p>Вы уверены, что хотите удалить рассылку #{{ mailing.id }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background-color: #d9534f;">Удалить</button>
    <a href="{% url 'mailing_list' %}" class="btn" style="background-color: #888;">Отмена</a>
</form>
{% endblock %}
