{% extends "base.html" %}

{% block content %}
<h1>Список сообщений</h1>
<a href="{% url 'message_create' %}" class="btn">Добавить сообщение</a>
<ul>
    {% for message in messages %}
    <li>
        {{ message.subject }}
        <a href="{% url 'message_update' message.pk %}">Редактировать</a>
        <a href="{% url 'message_delete' message.pk %}">Удалить</a>
    </li>
    {% empty %}
    <li>Сообщения отсутствуют</li>
    {% endfor %}
</ul>
{% endblock %}
